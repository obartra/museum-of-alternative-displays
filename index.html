<!doctype html>
<html lang="en" data-lights="on">
<head>
<meta charset="utf-8">
<!-- Every address in the museum is written from the museum's own folder. This page lies in that folder. A page in a folder further in has the way back out written here by the build. The address is then fixed in full, so that it still holds when the address bar changes. With scripts running, the plain words a page was sent with are hidden while the museum starts, so that they do not show for a moment first. -->
<base href="./">
<script>(function(){var b=document.querySelector('base');b.href=b.href;document.documentElement.classList.add('js')})()</script>
<style>.js [data-plain]{visibility:hidden;animation:plain 0s 1.2s forwards}@keyframes plain{to{visibility:visible}}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Museum of Alternative Displays</title>
<meta name="description" content="A museum of display technologies, from split-flap boards to holograms. Turn each one around and see how it makes a picture.">
<!-- What a chat or a search shows of a link to the museum: one name, one sentence and one picture for every address. The build writes them for each page, in each language. The addresses are written out in full, as those readers need them, and change if the museum moves. -->
<meta name="author" content="Os Bartra">
<link rel="canonical" href="https://obartra.github.io/museum-of-alternative-displays/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Museum of Alternative Displays">
<meta property="og:title" content="Museum of Alternative Displays">
<meta property="og:description" content="A museum of display technologies, from split-flap boards to holograms. Turn each one around and see how it makes a picture.">
<meta property="og:url" content="https://obartra.github.io/museum-of-alternative-displays/">
<meta property="og:image" content="https://obartra.github.io/museum-of-alternative-displays/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A row of glowing Nixie tubes on a concrete block in a white hall. Tall windows show a mountain ridge. A white plate at the lower right carries the mark, MU over AD, and the name of the museum.">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#e8e9e3">
<!-- The museum as an app: what a browser needs to install it. The build writes its own mark in the last of these tags. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alt Displays">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="build" content="__BUILD__">
<!-- The tab of a browser shows the first plate of the mark, the M on red lead. scripts/icons.ts makes both files. -->
<link rel="icon" href="/icons/favicon-48.png" sizes="48x48" type="image/png">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<script>
// Before anything else loads: day or night as it was left, and a head start on the one picture the page opens with.
(function () {
  var day = true;
  try { day = localStorage.getItem('lights') !== 'off'; } catch (e) {}
  document.documentElement.dataset.lights = day ? 'on' : 'off';
  if (!day) document.querySelector('meta[name="theme-color"]').content = '#08101a';
  // The place and the language the address names. The folders of the address say them, after the museum's own:
  // `ca/piece/nixie-tube/`. An older address says the place after a #.
  var words = __LANG_FILES__, folders = location.pathname.slice(new URL(document.baseURI).pathname.length).split('/');
  var named = words[folders[0]] ? folders.shift() : '';
  var place = location.hash.replace(/^#\/?/, '') || (folders[0] === 'piece' || folders[0] === 'hall' ? folders[0] + '-' + folders[1] : folders[0] || '');
  var piece = /^piece-([a-z0-9-]+)/.exec(place), hall = /^hall-(\d)/.exec(place);
  var first = __FIRST_IN_HALL__;
  var id = piece ? piece[1] : hall ? first[hall[1]] : '';
  var when = day ? '-day-' : '-night-', link = document.createElement('link');
  link.rel = 'preload'; link.as = 'image'; link.fetchPriority = 'high';
  // the same sizes as the picture itself declares, or the browser would fetch a second file
  if (id) {
    link.imageSrcset = './posters/' + id + when + '380.webp 380w, ./posters/' + id + when + '760.webp 760w';
    link.imageSizes = piece ? '(min-width: 900px) 50vw, 100vw' : '(max-width: 359px) 92vw, (max-width: 900px) 46vw, 300px';
    link.href = './posters/' + id + when + '760.webp';
  } else if (!place) {
    // the entrance opens on the room, on a phone as on a desk
    link.imageSrcset = './room' + when + '600.webp 600w, ./room' + when + '1200.webp 1200w';
    link.imageSizes = '(min-width: 900px) 56vw, 100vw';
    link.href = './room' + when + '1200.webp';
  } else link = null;
  if (link) document.head.appendChild(link);
  // A visitor who reads in another language needs its words before a page can be shown. They are asked for now,
  // beside the script of the pages, and not after it: the language is chosen here the way the pages choose it.
  var lang = named;
  if (!lang) try { lang = localStorage.getItem('lang') || ''; } catch (e) {}
  if (lang !== 'en' && !words[lang]) {
    lang = '';
    var tags = navigator.languages || [navigator.language || ''];
    for (var i = 0; i < tags.length && !lang; i++) { var code = tags[i].toLowerCase().split('-')[0]; if (code === 'en' || words[code]) lang = code; }
  }
  if (words[lang]) { var hint = document.createElement('link'); hint.rel = 'modulepreload'; hint.crossOrigin = ''; hint.href = './' + words[lang]; document.head.appendChild(hint); }
})();
</script>
</head>
<body>
<a class="vh" href="#main">Skip to content</a>
<div id="app"></div>
<noscript><p style="padding:24px;font-family:sans-serif">The models, the walk through the halls and the guided tours need JavaScript. The labels can be read without it.</p></noscript>
<script>
// The two faces every page is set in are asked for now, while the script of the pages is still on its way, so that
// the first picture of the page does not wait for one after the other.
try { document.fonts.load('800 1em "Sofia Sans Extra Condensed Variable"').catch(function () {}); document.fonts.load('500 1em "Sofia Sans Variable"').catch(function () {}); } catch (e) {}
</script>
<script>
// The plain words a page came with are hidden while the museum starts, for 1.2 seconds at most (the style above):
// on a slow line a reader then has the label, and the links to the other pages, while the rest arrives. If the
// script cannot run here they are shown at once.
(function () {
  var show = function () { if (!document.body.dataset.ready) document.documentElement.classList.remove('js'); };
  window.addEventListener('error', function (e) { if (e.target && e.target.tagName === 'SCRIPT') show(); }, true);
})();
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>

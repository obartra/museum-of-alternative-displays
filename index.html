<!doctype html>
<html lang="en" data-lights="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Museum of Alternative Displays</title>
<meta name="description" content="A vendor-neutral museum of display technologies that are not the screen you are holding. Fifty pieces you can turn around, with sources.">
<meta name="theme-color" content="#e8e9e3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23d1481f'/%3E%3Crect x='3' y='3' width='26' height='26' rx='3' fill='none' stroke='%23fff' stroke-width='1.5'/%3E%3Cpath d='M9 23V9l7 9 7-9v14' fill='none' stroke='%23fff' stroke-width='3.2'/%3E%3C/svg%3E">
<script>
// Before anything else loads: day or night as it was left, and a head start on the one picture the page opens with.
(function () {
  var day = true;
  try { day = localStorage.getItem('lights') !== 'off'; } catch (e) {}
  document.documentElement.dataset.lights = day ? 'on' : 'off';
  var piece = /^#\/?piece-([a-z0-9-]+)/.exec(location.hash), hall = /^#\/?hall-(\d)/.exec(location.hash);
  var first = __FIRST_IN_HALL__;
  var id = piece ? piece[1] : hall ? first[hall[1]] : '';
  if (!id) return;
  var base = './posters/' + id + (day ? '-day-' : '-night-'), link = document.createElement('link');
  link.rel = 'preload'; link.as = 'image'; link.fetchPriority = 'high';
  link.imageSrcset = base + '380.webp 380w, ' + base + '760.webp 760w';
  // the same sizes as the picture itself declares, or the browser would fetch a second file
  link.imageSizes = piece ? '(min-width: 900px) 50vw, 100vw' : '(max-width: 560px) 92vw, (max-width: 900px) 46vw, 300px';
  link.href = base + '760.webp';
  document.head.appendChild(link);
})();
</script>
</head>
<body>
<a class="vh" href="#main">Skip to content</a>
<div id="app"></div>
<noscript><p style="padding:24px;font-family:sans-serif">This museum is built in the browser and needs JavaScript. The collection data is in the repository under src/data.</p></noscript>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
